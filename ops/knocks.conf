# ops/knocks' settings (metal-vmm QUEUE 221). Edit here, never in the script.

[prod]
# Where the access logs and sshd are.
host = steve@162.243.1.123

[sites]
# Each site's short name (its /var/log/caddy/<name>-access.log, as
# deploy/Caddyfile's `import access_log <name>` names it) = the most hours its
# newest line may be old before knocks says so. A site missing here is still
# reported if it has a log, but never alarms.
lynrummy = 24
dogpark = 24
roc = 168
knock = 72

[ssh]
# The addresses an accepted ssh login may come from, space-separated: the dev
# box's. Any other accepted login is an alarm. Empty, knocks refuses to run:
# every login would be one.
allow =
