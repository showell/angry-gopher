<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Chat — abstract message bubbles">
  <!-- Deliberately ABSTRACT (not the real UI): colourful speech bubbles on a vivid
       ground, so it reads instantly as "chat" without pretending to show real
       features. No fake reactions, no fake chrome — the bars are just placeholder
       marks, the dots a typing indicator. Bright ground gives it presence against
       the white home page. -->
  <defs>
    <linearGradient id="ch-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46599e"/>
      <stop offset="1" stop-color="#54a6d6"/>
    </linearGradient>
    <filter id="ch-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a2240" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect width="600" height="420" fill="url(#ch-bg)"/>

  <g filter="url(#ch-shadow)">
    <!-- bubble 1 — left, white -->
    <path d="M64,60 h232 a22,22 0 0 1 22,22 v44 a22,22 0 0 1 -22,22 h-202 l-22,22 v-22 a22,22 0 0 1 -8,-16 v-50 a22,22 0 0 1 22,-22 z" fill="#ffffff"/>
    <g fill="#9aa2bf"><rect x="86" y="84" width="186" height="11" rx="5.5"/><rect x="86" y="104" width="128" height="11" rx="5.5"/></g>

    <!-- bubble 2 — right, amber -->
    <path d="M312,150 h202 a22,22 0 0 1 22,22 v40 a22,22 0 0 1 -22,22 v22 l-22,-22 h-180 a22,22 0 0 1 -22,-22 v-40 a22,22 0 0 1 22,-22 z" fill="#ffd07a"/>
    <g fill="#000" opacity="0.18"><rect x="332" y="174" width="180" height="11" rx="5.5"/><rect x="332" y="194" width="96" height="11" rx="5.5"/></g>

    <!-- bubble 3 — left, mint -->
    <path d="M86,250 h188 a20,20 0 0 1 20,20 v38 a20,20 0 0 1 -20,20 h-160 l-20,20 v-20 a20,20 0 0 1 -8,-16 v-42 a20,20 0 0 1 20,-20 z" fill="#8fe0bf"/>
    <g fill="#000" opacity="0.16"><rect x="106" y="272" width="150" height="10" rx="5"/><rect x="106" y="290" width="84" height="10" rx="5"/></g>

    <!-- bubble 4 — right, lavender, mid-typing (three dots) -->
    <path d="M392,338 h112 a20,20 0 0 1 20,20 v22 a20,20 0 0 1 -20,20 v18 l-20,-18 h-92 a20,20 0 0 1 -20,-20 v-22 a20,20 0 0 1 20,-20 z" fill="#d7d2ff"/>
    <g fill="#5a5390"><circle cx="424" cy="369" r="6"/><circle cx="448" cy="369" r="6"/><circle cx="472" cy="369" r="6"/></g>
  </g>
</svg>
