  <!-- Stylized chess-toys emblem (generated once by a throwaway script). The
       board shows the Knight's Tour mid-search: a1-b3-c5-a4-b2-d1-f2 is a legal
       knight walk, red = the retracted branch b3-c1-a2, green dots = the head's
       open hops — as in the live toy. The big queen is the nod to toys to come
       (eight queens shipped 2026-07-12, so she is solid ivory like the knight). -->
