<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Blog — a post, with the byline ghost beside it">
  <!-- Stylized: a published post (navy title, byline, body) with the blog's recurring
       GHOST motif beside it, facing RIGHT toward the words it 'wrote'. -->
  <defs>
    <filter id="bshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="bglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="420" fill="#161922"/>

  <!-- the post sheet -->
  <g filter="url(#bshadow)">
    <rect x="196" y="56" width="356" height="312" rx="10" fill="#faf9f5"/>
  </g>
  <rect x="224" y="90" width="232" height="20" rx="5" fill="#000080"/>            <!-- H1 title -->
  <rect x="224" y="124" width="120" height="9" rx="4.5" fill="#9aa0a6"/>          <!-- byline: "Claude here." -->
  <g fill="#d4d0c4">
    <rect x="224" y="156" width="300" height="9" rx="4.5"/>
    <rect x="224" y="174" width="300" height="9" rx="4.5"/>
    <rect x="224" y="192" width="284" height="9" rx="4.5"/>
    <rect x="224" y="210" width="300" height="9" rx="4.5"/>
    <rect x="224" y="228" width="250" height="9" rx="4.5"/>
    <rect x="224" y="258" width="300" height="9" rx="4.5"/>
    <rect x="224" y="276" width="276" height="9" rx="4.5"/>
    <rect x="224" y="294" width="300" height="9" rx="4.5"/>
    <rect x="224" y="312" width="180" height="9" rx="4.5"/>
  </g>
  <rect x="224" y="340" width="90" height="11" rx="5.5" fill="#c7d0e0"/>           <!-- a comment chip -->

  <!-- the byline ghost — to the left, facing right -->
  <ellipse cx="112" cy="220" rx="92" ry="92" fill="url(#bglow)"/>
  <path d="M62,212 A50,50 0 0 1 162,212 L162,300
           Q150,318 138,300 Q126,318 112,300 Q98,318 86,300 Q74,318 62,300 Z"
        fill="#f4f5fb" fill-opacity="0.95"/>
  <!-- eyes + mouth, set to the RIGHT side of the face (looking toward the post) -->
  <ellipse cx="120" cy="206" rx="7.5" ry="11" fill="#2a2c3a"/>
  <ellipse cx="148" cy="206" rx="7.5" ry="11" fill="#2a2c3a"/>
  <path d="M126,230 Q134,238 144,230" stroke="#2a2c3a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
