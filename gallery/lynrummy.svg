<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Lyn Rummy — a hand of cards fanned out">
  <!-- Stylized: a hand of playing cards fanned to the RIGHT on green felt — a heart
       run building, the game's whole flavour (runs + sets) in one image. -->
  <defs>
    <radialGradient id="felt" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2f7d54"/>
      <stop offset="1" stop-color="#184e36"/>
    </radialGradient>
    <filter id="lshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="420" fill="url(#felt)"/>

  <g filter="url(#lshadow)" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
    <!-- leftmost drawn first, rightmost on top; fan pivots bottom-centre, leaning right -->
    <g transform="translate(300,392) rotate(-18)">
      <rect x="-34" y="-152" width="68" height="96" rx="7" fill="#fff" stroke="#d6d6d6" stroke-width="1.5"/>
      <text x="-26" y="-130" font-size="18" fill="#222">9</text>
      <text x="-27" y="-112" font-size="15" fill="#222">&#9827;</text>
      <text x="0" y="-92" font-size="30" text-anchor="middle" fill="#222">&#9827;</text>
    </g>
    <g transform="translate(300,392) rotate(-8)">
      <rect x="-34" y="-152" width="68" height="96" rx="7" fill="#fff" stroke="#d6d6d6" stroke-width="1.5"/>
      <text x="-29" y="-130" font-size="18" fill="#cc2233">10</text>
      <text x="-27" y="-112" font-size="15" fill="#cc2233">&#9829;</text>
      <text x="0" y="-92" font-size="30" text-anchor="middle" fill="#cc2233">&#9829;</text>
    </g>
    <g transform="translate(300,392) rotate(2)">
      <rect x="-34" y="-152" width="68" height="96" rx="7" fill="#fff" stroke="#d6d6d6" stroke-width="1.5"/>
      <text x="-26" y="-130" font-size="18" fill="#cc2233">J</text>
      <text x="-27" y="-112" font-size="15" fill="#cc2233">&#9829;</text>
      <text x="0" y="-92" font-size="30" text-anchor="middle" fill="#cc2233">&#9829;</text>
    </g>
    <g transform="translate(300,392) rotate(13)">
      <rect x="-34" y="-152" width="68" height="96" rx="7" fill="#fff" stroke="#d6d6d6" stroke-width="1.5"/>
      <text x="-26" y="-130" font-size="18" fill="#cc2233">Q</text>
      <text x="-27" y="-112" font-size="15" fill="#cc2233">&#9829;</text>
      <text x="0" y="-92" font-size="30" text-anchor="middle" fill="#cc2233">&#9829;</text>
    </g>
    <g transform="translate(300,392) rotate(25)">
      <rect x="-34" y="-152" width="68" height="96" rx="7" fill="#fff" stroke="#d6d6d6" stroke-width="1.5"/>
      <text x="-26" y="-130" font-size="18" fill="#222">A</text>
      <text x="-27" y="-112" font-size="15" fill="#222">&#9824;</text>
      <text x="0" y="-92" font-size="30" text-anchor="middle" fill="#222">&#9824;</text>
    </g>
  </g>
</svg>
